name: Package SideKeyPlus module

on:
  workflow_dispatch:
  push: {}

permissions:
  contents: write

env:
  MODULE_ZIP: SideKeyPlus-module.zip

jobs:
  version-check:
    name: Check module version changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect module.prop change
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            if git rev-parse --verify "${after}^" >/dev/null 2>&1; then
              before="${after}^"
            else
              before=""
            fi
          fi

          if [[ -z "$before" ]] || ! git diff --quiet "$before" "$after" -- module.prop; then
            changed=true
          else
            changed=false
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "module.prop changed: $changed"

  package-module:
    name: Build and validate SideKeyPlus ZIP
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare module staging directory
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version=//p' module.prop | head -n 1)"
          version_code="$(sed -n 's/^versionCode=//p' module.prop | head -n 1)"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "invalid module version: $version" >&2; exit 1; }
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || { echo "invalid module versionCode: $version_code" >&2; exit 1; }
          grep -Eq '^id=SideKeyPlus$' module.prop

          rm -rf staging "$MODULE_ZIP"
          mkdir -p staging
          git archive HEAD | tar -x -C staging

          rm -rf staging/.git staging/.github staging/.pytest_cache staging/__pycache__
          rm -f staging/.gitignore \
                staging/README.md \
                staging/TorchCtl.java \
                staging/skp-keyd.c \
                staging/build.sh \
                staging/build_torchctl.sh

          chmod 0755 staging/*.sh staging/bin/skp-keyd staging/META-INF/com/google/android/update-binary
          chmod 0644 staging/bin/torchctl.dex.jar staging/module.prop staging/webroot/webui/index.html.tpl

      - name: Validate module staging
        shell: bash
        run: |
          set -euo pipefail

          required=(
            module.prop
            customize.sh
            service.sh
            action.sh
            run_action.sh
            stop.sh
            uninstall.sh
            common.sh
            cgi.sh
            bin/skp-keyd
            bin/torchctl.dex.jar
            webroot/webui/index.html.tpl
            META-INF/com/google/android/update-binary
            META-INF/com/google/android/updater-script
          )
          for path in "${required[@]}"; do
            test -s "staging/$path" || { echo "missing module entry: $path" >&2; exit 1; }
          done

          for script in staging/*.sh staging/META-INF/com/google/android/update-binary; do
            sh -n "$script"
          done
          test -x staging/bin/skp-keyd
          ! find staging -type f -name '*.zip' -print -quit | grep -q .

      - name: Create module ZIP
        shell: bash
        run: |
          set -euo pipefail
          (
            cd staging
            zip -r -9 "../$MODULE_ZIP" .
          )

          python3 - "$MODULE_ZIP" <<'PY'
          import sys
          import zipfile

          required = {
              "module.prop",
              "customize.sh",
              "service.sh",
              "action.sh",
              "run_action.sh",
              "stop.sh",
              "uninstall.sh",
              "common.sh",
              "cgi.sh",
              "bin/skp-keyd",
              "bin/torchctl.dex.jar",
              "webroot/webui/index.html.tpl",
              "META-INF/com/google/android/update-binary",
              "META-INF/com/google/android/updater-script",
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              missing = required - names
              unsafe = [name for name in names if name.startswith("/") or ".." in name.split("/")]
              nested = [name for name in names if name.lower().endswith(".zip")]
              if missing:
                  raise SystemExit(f"missing module entries: {sorted(missing)}")
              if unsafe:
                  raise SystemExit(f"unsafe ZIP entries: {unsafe}")
              if nested:
                  raise SystemExit(f"nested archives are not allowed: {nested}")
          PY

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideKeyPlus-module
          path: ${{ env.MODULE_ZIP }}
          if-no-files-found: error

  release:
    name: Publish SideKeyPlus release
    runs-on: ubuntu-latest
    needs: package-module
    if: >-
      needs.package-module.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^version=//p' module.prop | head -n 1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "${tag#v}" == "$expected" ]] || {
              echo "tag version (${tag#v}) must match module.prop ($expected)" >&2
              exit 1
            }
          else
            tag="v$expected"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download module artifact
        uses: actions/download-artifact@v4
        with:
          name: SideKeyPlus-module
          path: dist

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SideKeyPlus ${{ steps.release.outputs.tag }}
          body: "SideKey+ KernelSU / Magisk 模块发布包。"
          overwrite_files: true
          files: dist/${{ env.MODULE_ZIP }}
