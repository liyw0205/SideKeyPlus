name: Package SideKeyPlus module

on:
  workflow_dispatch:
  push: {}

permissions:
  contents: write

env:
  MODULE_ZIP: SideKeyPlus-module.zip

jobs:
  version-check:
    name: Check version.json changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version.json change
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Initial push: package the current module version."
            exit 0
          fi

          if [[ -z "$before" ]] || ! git diff --quiet "$before" "$after" -- version.json; then
            changed=true
          else
            changed=false
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "version.json changed: $changed"

  package-module:
    name: Build and validate SideKeyPlus ZIP
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare module staging directory
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("version.json").read_text(encoding="utf-8"))
          version = info.get("version")
          version_code = info.get("versionCode")
          if not isinstance(version, str) or not version.strip():
              raise SystemExit("version.json.version must be a non-empty string")
          if not isinstance(version_code, int) or version_code < 1:
              raise SystemExit("version.json.versionCode must be a positive integer")
          for key in ("zipUrl", "changelog"):
              if not isinstance(info.get(key), str) or not info[key].strip():
                  raise SystemExit(f"version.json.{key} must be a non-empty string")

          props = {}
          for line in Path("module.prop").read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  props[key] = value
          if props.get("id") != "SideKeyPlus":
              raise SystemExit("module.prop.id must be SideKeyPlus")
          if props.get("version") != version:
              raise SystemExit("module.prop.version must match version.json.version")
          if props.get("versionCode") != str(version_code):
              raise SystemExit("module.prop.versionCode must match version.json.versionCode")
          if not props.get("updateJson"):
              raise SystemExit("module.prop.updateJson is missing")
          PY

          rm -rf staging "$MODULE_ZIP"
          mkdir -p staging
          git archive HEAD | tar -x -C staging

          rm -rf staging/.git staging/.github staging/.pytest_cache staging/__pycache__ staging/tools
          rm -f staging/.gitignore \
                staging/README.md \
                staging/TorchCtl.java \
                staging/skp-keyd.c \
                staging/build.sh \
                staging/build_torchctl.sh

          chmod 0755 staging/*.sh staging/bin/skp-keyd staging/META-INF/com/google/android/update-binary
          chmod 0644 staging/bin/torchctl.dex.jar staging/module.prop staging/webroot/webui/index.html.tpl

      - name: Validate module staging
        shell: bash
        run: |
          set -euo pipefail

          required=(
            module.prop
            customize.sh
            service.sh
            action.sh
            run_action.sh
            stop.sh
            uninstall.sh
            common.sh
            cgi.sh
            version.json
            changelog.md
            bin/skp-keyd
            bin/torchctl.dex.jar
            webroot/webui/index.html.tpl
            META-INF/com/google/android/update-binary
            META-INF/com/google/android/updater-script
          )
          for path in "${required[@]}"; do
            test -s "staging/$path" || { echo "missing module entry: $path" >&2; exit 1; }
          done

          for script in staging/*.sh staging/META-INF/com/google/android/update-binary; do
            sh -n "$script"
          done
          test -x staging/bin/skp-keyd
          ! find staging -type f -name '*.zip' -print -quit | grep -q .

      - name: Create module ZIP
        shell: bash
        run: |
          set -euo pipefail
          (
            cd staging
            zip -r -9 "../$MODULE_ZIP" .
          )

          python3 - "$MODULE_ZIP" <<'PY'
          import sys
          import zipfile

          required = {
              "module.prop",
              "customize.sh",
              "service.sh",
              "action.sh",
              "run_action.sh",
              "stop.sh",
              "uninstall.sh",
              "common.sh",
              "cgi.sh",
              "version.json",
              "changelog.md",
              "bin/skp-keyd",
              "bin/torchctl.dex.jar",
              "webroot/webui/index.html.tpl",
              "META-INF/com/google/android/update-binary",
              "META-INF/com/google/android/updater-script",
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              missing = required - names
              unsafe = [name for name in names if name.startswith("/") or ".." in name.split("/")]
              nested = [name for name in names if name.lower().endswith(".zip")]
              if missing:
                  raise SystemExit(f"missing module entries: {sorted(missing)}")
              if unsafe:
                  raise SystemExit(f"unsafe ZIP entries: {unsafe}")
              if nested:
                  raise SystemExit(f"nested archives are not allowed: {nested}")
          PY

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideKeyPlus-module
          path: ${{ env.MODULE_ZIP }}
          if-no-files-found: error

  release:
    name: Publish SideKeyPlus release
    runs-on: ubuntu-latest
    needs: package-module
    if: >-
      needs.package-module.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json; print(json.load(open("version.json", encoding="utf-8"))["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "${tag#v}" == "$expected" ]] || {
              echo "tag version (${tag#v}) must match module.prop ($expected)" >&2
              exit 1
            }
          else
            tag="v$expected"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare version-specific release notes
        shell: bash
        run: python3 tools/release_notes.py --output release-notes.md

      - name: Download module artifact
        uses: actions/download-artifact@v4
        with:
          name: SideKeyPlus-module
          path: dist

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SideKeyPlus ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          overwrite_files: true
          files: dist/${{ env.MODULE_ZIP }}
